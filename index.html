<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>TG_@Cricmatchstream</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

.shaka-video-container {
    width: 100%;
    height: 100%;
    background: #000;
}

#videoPlayer {
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
}

/* Telegram Popup */
#telegramPopup {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.88);
    padding: 20px;
    box-sizing: border-box;
}

.popup-box {
    width: 100%;
    max-width: 340px;
    padding: 28px 22px;
    border-radius: 16px;
    text-align: center;
    background: #151515;
    color: #fff;
    border: 1px solid #303030;
    box-sizing: border-box;
}

.telegram-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #229ED9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
}

.popup-box h2 {
    margin: 0 0 10px;
    font-size: 23px;
}

.popup-box p {
    color: #bbb;
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 22px;
}

.popup-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
    text-decoration: none;
}

.join-btn {
    background: #229ED9;
    color: #fff;
}

.join-btn:hover {
    background: #168ac0;
}

.already-btn {
    background: #292929;
    color: #fff;
}

.already-btn:hover {
    background: #383838;
}
</style>
</head>

<body>

<div id="videoContainer" class="shaka-video-container">
    <video id="videoPlayer" playsinline autoplay muted></video>
</div>

<div id="telegramPopup">
    <div class="popup-box">
        <div class="telegram-icon">➤</div>
        <h2>Join Our Telegram</h2>
        <p>Join <strong>@cricmatchstream</strong> for updates and more live links.</p>

        <a
            class="popup-btn join-btn"
            href="https://t.me/cricmatchstream"
            target="_blank"
            rel="noopener noreferrer"
        >JOIN TELEGRAM</a>

        <button
            class="popup-btn already-btn"
            id="alreadyJoined"
            type="button"
        >ALREADY JOINED</button>
    </div>
</div>

<script>
const STREAM_URL =
    "https://jiotvpllive.cdn.jio.com//bpk-tv/Star_Sports_HD1_BTS/WDVLive/index.mpd";

const DRM_KEYS =
    "45825561f4ef516691a9e16d1d35dd1d:3951fe7fbf4b0b33e6246fc401f76797,bf95222d9be85d85a91281e796e99481:bc932276031b3e63758cf67b147c3557,f217e9fe133e5b948c323abef1e39b47:63640dc4430d14003def0c97a2dbab4d,eda3132244745c10920b01536bc8a75b:2b5f8bdba279032943a040078bb22b35,06dd6287c4b956419d15d6c8e513aeed:a82d6b850b5c281c0054fc6d55e1c6ba";

const COOKIE_JSON_URL =
    "https://sonujson-v4.pages.dev/Data/sports.json";

const CHANNEL_ID = "E1HD";
const videoElement = document.getElementById("videoPlayer");
const videoContainer = document.getElementById("videoContainer");

let player;
let ui;

document.getElementById("alreadyJoined").addEventListener("click", () => {
    document.getElementById("telegramPopup").style.display = "none";
});

function parseDrmKeys(value) {
    const clearKeys = {};

    String(value || "").split(",").forEach(pair => {
        const separator = pair.indexOf(":");
        if (separator === -1) return;

        const kid = pair.slice(0, separator).trim().toLowerCase();
        const key = pair.slice(separator + 1).trim().toLowerCase();

        if (kid && key) clearKeys[kid] = key;
    });

    return clearKeys;
}

async function getCookie() {
    const response = await fetch(COOKIE_JSON_URL, {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error("Cookie JSON request failed: " + response.status);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.channels)) {
        throw new Error("Invalid JSON format.");
    }

    const channel = data.channels.find(item =>
        String(item.id || "").trim().toLowerCase() ===
        CHANNEL_ID.toLowerCase()
    );

    if (!channel || !channel.cookie) {
        throw new Error("Channel cookie not found.");
    }

    return String(channel.cookie).trim();
}

function configureStreamRequests(cookie) {
    if (!cookie) return;

    const networkingEngine = player.getNetworkingEngine();
    if (!networkingEngine) return;

    networkingEngine.registerRequestFilter((type, request) => {
        if (!request.uris || !request.uris[0]) return;

        request.headers = request.headers || {};
        request.headers["Cookie"] = cookie;

        const url = request.uris[0];

        if (
            (type === 0 || type === 1) &&
            !url.includes("__hdnea=") &&
            !url.includes("__hdnea__") &&
            !url.includes("hdnts=")
        ) {
            request.uris[0] = url +
                (url.includes("?") ? "&" : "?") + cookie;
        }
    });
}

function configureDrm() {
    player.configure({
        drm: {
            clearKeys: parseDrmKeys(DRM_KEYS)
        },
        manifest: {
            defaultPresentationDelay: 5
        },
        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
        }
    });
}

async function initPlayer() {
    try {
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            throw new Error("This browser does not support Shaka Player.");
        }

        player = new shaka.Player();
        await player.attach(videoElement);

        ui = new shaka.ui.Overlay(
            player,
            videoContainer,
            videoElement
        );

        ui.configure({
            controlPanelElements: [
                "play_pause",
                "time_and_duration",
                "mute",
                "volume",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
            ]
        });

        player.addEventListener("error", event => {
            console.error("Shaka Player Error:", event.detail);
        });

        const cookie = await getCookie();
        configureStreamRequests(cookie);
        configureDrm();

        await player.load(STREAM_URL);

        try {
            await videoElement.play();
        } catch (error) {
            console.log("Autoplay blocked.");
        }
    } catch (error) {
        console.error("Player initialization failed:", error);
    }
}

initPlayer();

window.addEventListener("beforeunload", () => {
    if (player) {
        player.destroy().catch(() => {});
    }
});
</script>

</body>
</html>
